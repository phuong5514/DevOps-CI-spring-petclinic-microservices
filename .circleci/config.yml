version: 2.1
executors:
  java-executor:
    docker:
      - image: circleci/openjdk:11-jdk
    working_directory: ~/repo
jobs:
  build-and-test:
    executor: java-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: ./mvnw install
      - run:
          name: Test
          command: ./mvnw test
workflows:
  version: 2
  build_and_test:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main
